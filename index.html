<script>
/* CODEBREAKERS: THE SILENT SERVICE: a WWII codebreakers and spies game. Content (written from memory; proofread before class). */

    open: { s: -10, i: 9, t: -2, p: 11 }, hold: { s: 8, i: -8, t: -2, p: 8 },

  const ORDER = [["cover", "open", "hold"], ["cover", "open", "hold"], ["share", "hold3", "blunder"], ["cover", "open", "hold"], ["cover", "open", "hold"], ["cover", "open", "hold"]];
  const ROLE_IDS = ["BP", "NV", "FA", "MI", "UL"];
  const ROUNDS = [
    { id: "r1", date: "1939 to 1940", title: "A Gift from Poland", scene: "enigma",
      sitrep: ["July 1939. Weeks before Germany invades Poland, Polish codebreakers meet British and French officers outside Warsaw. They have been reading Germany's Enigma machine since 1932, and they hand over replica machines and their methods.", "Britain takes the knowledge to a country house called Bletchley Park. Germany's army and air force change their machine settings every day at midnight, so each morning the work starts over. The only thing worse than not reading the codes is letting the enemy find out that you can."],
      eq: "How do you use a secret without losing it?",
      terms: [{ t: "Enigma", d: "The cipher machine Germany used for military messages. Each letter typed came out as a different letter." }, { t: "Cipher", d: "A way of scrambling a message so that only someone with the key can read it." }],
      msg: ["POLAND", "GAVE US", "THE FIRST", "KEY TO", "ENIGMA"],
      real: "In July 1939 the Polish Cipher Bureau, whose mathematicians Marian Rejewski, Jerzy Różycki and Henryk Zygalski had broken Enigma in the early 1930s, gave replicas and methods to Britain and France. Bletchley Park built on that gift. Without it, Britain would have started years behind.", ask: "Why might a smaller country's secret help a bigger one win?" },
    { id: "r2", date: "1941", title: "The Atlantic", scene: "convoy",
      sitrep: ["Spring 1941. German U-boats sink merchant ships faster than Britain can build them. In May, sailors capture codebooks from a U-boat, and Bletchley can read some U-boat orders for the first time.", "Ultra, the name for this intelligence, shows exactly where the wolf packs wait. Steering a convoy around them saves ships. Doing it too neatly, too often, tells Germany that someone is reading its mail."],
      eq: "When is saving lives today worth risking tomorrow's secret?",
      terms: [{ t: "Ultra", d: "The code name for intelligence from the highest-level German ciphers, such as Enigma." }, { t: "Cover story", d: "A believable explanation, such as a patrol aircraft's sighting, for how you really knew something." }],
      msg: ["NEVER ACT", "ON ULTRA", "WITHOUT", "A COVER", "STORY"],
      real: "Acting on Ultra intelligence needed a plausible cover story, such as a reconnaissance flight that could have 'found' a convoy or a ship by chance. The cover explained how you knew without hinting at the codebreaking. The rule helped keep Enigma's secret for years.", ask: "Why did leaders accept losing some battles to protect a source?" },
    { id: "r3", date: "Late 1941 to early 1942", title: "When the Signals Stop", scene: "silence",
      sitrep: ["November 1941. Japanese aircraft carriers leave port under strict radio silence. American listeners who track them every day suddenly hear nothing. Across the Atlantic, in February 1942, Germany adds a fourth rotor to its U-boat Enigma, and Bletchley goes dark too.", "Both sides of the Allied intelligence world face the same question. When the signals stop, is that nothing to worry about, or is the silence the warning?"],
      eq: "What does it mean when the signals stop?",
      terms: [{ t: "Radio silence", d: "Ships or units deliberately not transmitting, so no one can track them by their signals." }, { t: "Blackout", d: "A period when codebreakers cannot read an enemy cipher after the enemy changes it." }],
      msg: ["SILENCE", "ON THE", "RADIO", "IS ALSO", "A SIGNAL"],
      real: "In late November 1941, Japan's carrier force sailed toward Hawaii under radio silence, and American analysts lost track of it. The attack on Pearl Harbor came on December 7. Historians still debate who knew what. In February 1942 the 'Shark' blackout left Bletchley unable to read U-boat traffic for about ten months. In both cases, the missing signal mattered.", ask: "How should you plan when you know you have lost sight of the enemy?" },
    { id: "r4", date: "May to June 1942", title: "Water at Midway", scene: "midway",
      sitrep: ["Spring 1942. American codebreakers in Hawaii can read parts of Japan's main naval code, called JN-25. They see Japan preparing a big strike on a place the Japanese call 'AF'.", "Washington thinks AF is somewhere else. A Navy officer named Joseph Rochefort thinks it is Midway Island. He has a clever way to find out, and not much time to do it."],
      eq: "How do you prove a hunch before it is too late?",
      terms: [{ t: "JN-25", d: "The code the Japanese navy used for most of its messages; the Allies read parts of it." }, { t: "Midway", d: "A small American island in the Pacific, about halfway between Asia and North America." }],
      msg: ["AF", "IS SHORT", "OF", "FRESH", "WATER"],
      real: "Rochefort's team had Midway send a plain-language radio message saying its water plant had broken. Soon after, Japanese code messages reported that 'AF' was short of fresh water. That proved AF was Midway. In early June 1942, American carriers were waiting and sank four Japanese carriers. Midway is widely seen as the turning point of the war in the Pacific.", ask: "Why was a test better than an argument?" },
    { id: "r5", date: "April 1943", title: "Spending a Secret", scene: "intercept",
      sitrep: ["April 1943. In the Pacific, an intercepted message gives the schedule of Admiral Yamamoto, who planned the attack on Pearl Harbor, for a visit to a front-line island on April 18. American fighters could reach him, but only just.", "In Europe, the same month, British planners drop a body carrying forged papers into the sea off Spain. It is a lie designed to make Germany look in the wrong place. Both plans depend on keeping a very small secret."],
      eq: "Who decides when a secret is worth spending?",
      terms: [{ t: "Coast-watcher", d: "Allied observers hidden on Pacific islands who radioed warnings about Japanese ships and planes." }, { t: "Deception", d: "Planting false information so the enemy makes the wrong choice." }],
      msg: ["YAMAMOTO", "WILL VISIT", "BOUGAINVILLE", "ON THE", "EIGHTEENTH"],
      real: "On April 18, 1943, American P-38 fighters shot down Yamamoto's plane over Bougainville after codebreakers read his flight plan. The Americans spread a story that a coast-watcher had spotted him, as cover. Japan suspected its code might be read but kept using it. Meanwhile, Operation Mincemeat, the 'man who never was', helped convince Germany that the Allies would land in Greece and Sardinia.", ask: "How do you weigh a single big result against a lasting secret?" },
    { id: "r6", date: "1944", title: "A Lie for D-Day", scene: "decoy",
      sitrep: ["Spring 1944. The Allies plan to land in Normandy. To keep Germany guessing, they create a fake army, with inflatable tanks and false radio chatter, apparently preparing to cross at Calais. Double agents back up the story.", "Codebreakers now read very senior German messages, including ones using a cipher called Tunny. They can see whether the lie is believed. A lot depends on a story that cannot be tested in advance."],
      eq: "How do you lie to an enemy and stay honest with your own side?",
      terms: [{ t: "Double agent", d: "A spy who appears to work for one side while secretly working for the other." }, { t: "Operation Fortitude", d: "The Allied deception campaign meant to make Germany expect an invasion at Calais." }],
      msg: ["BERLIN", "BELIEVES", "THE MAIN", "ATTACK", "IS CALAIS"],
      real: "Operation Fortitude convinced much of the German high command that the main landing would come at Calais, even after the Normandy landings began. Some German armored divisions were held back for weeks. Double agents such as Juan Pujol García, code-named Garbo, helped. Bletchley decrypts let the Allies see that the lie was being believed.", ask: "What is the difference between deceiving an enemy and deceiving yourself?" }
  ];
  const T = (s) => s; // marker for translators/proofreaders
  const ROLES = [
    { id: "BP", name: "Bletchley Park Analyst", short: "Codebreaker", place: "Buckinghamshire, England", color: "#7a4e2d", blurb: "You break German ciphers in a country house. You decide who gets to know what the codes say.",
      echo: "Real people in roles like yours include Alan Turing and Gordon Welchman, who developed methods and machines, Joan Clarke, and Mavis Batey, who helped break an Italian naval cipher before the Battle of Cape Matapan. Most of Bletchley's staff were women.",
      qs: ["Navy cryptanalysts: how did your team prove what you suspected?", "Ultra Liaison officers: how did you explain orders without saying why?", "Case officers: did the deception hold up in the decrypts you saw?"],
      r: [
        { src: "Hut 6 log, 1940", text: "Germany's army and air force change their Enigma settings at midnight. You have the Polish methods, a handful of staff and not enough machines. One morning's key can unlock a whole day of orders, but only if the secret stays inside the hut.", ask: "How do you run Hut 6 in these first months?",
          c: [["Work on a strict need-to-know basis and send results out under a cover name.", "Results go out as reports from a made-up agent. Commanders get the intelligence, and the Germans have no reason to suspect a broken machine."], ["Brief every senior commander on exactly how the traffic is read, so they trust it.", "The commanders trust the product, but dozens of people now know the secret. Each one is a possible leak, and the circle is hard to shrink."], ["Keep every result inside the hut until the work is perfect.", "The secret is safe, but nothing changes at the front. Leaders cannot use what they never receive."]] },
        { src: "Naval Section note, 1941", text: "Since a U-boat's codebooks were captured in May, your hut can read U-boat orders. A wolf pack waits along a convoy's usual route. Rerouting is easy. Rerouting too often, and too precisely, may tell Germany something is wrong.", ask: "How do you advise the Admiralty?",
          c: [["Reroute convoys in varied ways and ask for patrol flights to give a believable reason.", "Fewer ships are lost. Aircraft seem to find U-boats by chance, and Germany blames bad luck."], ["Dodge every wolf pack exactly, every time, and tell the escorts why.", "Ships are saved for a while, but the pattern is too perfect. German analysts start asking whether their codes are safe."], ["Warn no one, so the secret stays absolutely safe.", "The secret holds. A convoy sails into the wolf pack, and ships and sailors are lost that could have been saved."]] },
        { src: "Hut 8 diary, February 1942", text: "Without warning, U-boat traffic turns to nonsense. Germany has added a fourth rotor to its machines, and your section can read none of it. Nobody knows how long that will last. The Admiralty is asking what you can still tell them.", ask: "What do you tell the Admiralty during the blackout?",
          c: [["Say plainly that the window is closed, then pass on every other clue you can still gather.", "The news is unwelcome, but the Admiralty plans around it. Other sources fill part of the gap while your colleagues work on the new machine."], ["Say nothing and hope the problem fixes itself.", "The Admiralty plans as if you can still see, and a silent hut is read as a safe sea. Trust in your section drops."], ["Pretend you can still read it and give your best guesses as fact.", "Your guesses sound confident and some are wrong. When the errors come out, the Admiralty stops trusting the rest."]] },
        { src: "Letter from a friendly service, 1942", text: "The Americans in Hawaii are racing to read the Japanese navy's code. They have asked for help with a code group that seems to mean 'AF'. Sharing what you know could help them, but it adds more people to the circle.", ask: "Do you share what you have with the Americans?",
          c: [["Send exactly what is useful, through the secure channel, and nothing else.", "The Americans get what they need in time, without a flood of extra detail. A narrow channel keeps the circle small."], ["Send everything, including how you learned it, so they can use it any way they like.", "The Americans are grateful and the exchange speeds up, but your sources and methods are now in more files than you can count."], ["Hold it back, because the secret matters more than their problem.", "Nothing leaks, but the Americans work without your piece of the puzzle, and the question about AF stays open longer."]] },
        { src: "Hut 3 summary, April 1943", text: "A body carrying forged papers has been left off the Spanish coast, to convince Germany that the Allies will land in Greece and Sardinia instead of Sicily. Only your decrypts can show whether Germany believed it. If the answer reaches too many desks, the trick could be exposed.", ask: "How do you report whether the deception worked?",
          c: [["Report to the small planning group only, and explain what changed in German orders.", "The planners learn that German forces are moving toward Greece and Sardinia. The deception stays inside a small circle."], ["Circulate the news widely so every planner can adjust at once.", "More people can adjust their plans, but more people now know you read German orders about Allied plans. Rumors travel."], ["Wait until you are completely certain before telling anyone.", "You wait for certainty while planners work blind for days. The secret is fine, but the timing is not."]] },
        { src: "Newmanry report, 1944", text: "An electronic machine named Colossus helps your colleagues read a different German cipher, called Tunny, used by the high command. A message shows that Hitler's staff still expect the main attack at Calais. The deception planners would like to know. Changing plans in response is risky.", ask: "How do you pass on the news?",
          c: [["Pass it straight to the deception planners with a clear note that Germany believes the story.", "The planners keep feeding the false story, and the Normandy landings meet weaker armored opposition than they might have."], ["Tell all invasion units, so everyone feels confident.", "Confidence rises, but a secret meant for a few is now in many mess halls. Some of it is almost certain to leak."], ["Say nothing, because the deception should not be touched.", "Deceivers and planners work without confirmation. The story holds anyway, but nobody can be sure it will."]] }
      ] },
    { id: "NV", name: "Navy Cryptanalyst", short: "US Navy", place: "Washington and Hawaii", color: "#2b4a6b", blurb: "You work on Japan's naval codes for the US Navy. You decide what the fleet is told, and when.",
      echo: "Real people in roles like yours include Joseph Rochefort, who led the Hawaii team (Station HYPO) at Midway, Agnes Meyer Driscoll, who broke earlier Japanese naval codes, and the hundreds of Navy WAVES who worked in cryptology.",
      qs: ["Bletchley analysts: what could you share that would have helped us read JN-25?", "Field agents: how did your reports reach people like me?", "Ultra Liaison officers: how did you explain our results to commanders?"],
      r: [
        { src: "Navy memo, 1939 to 1940", text: "A new Japanese naval code has appeared. Later it will be called JN-25. The Navy has few trained analysts and several priorities. You can put most of your effort on the new code, or spread your team across other tasks. Nobody knows when the code will matter.", ask: "How do you use your small team?",
          c: [["Focus the team on the new code and share findings only with a small group in Washington.", "The team learns the code steadily and quietly. When war comes, you will already have a head start."], ["Tell the fleet about the new code and every early finding, so it can prepare.", "The fleet is excited and well-briefed, but half-solved results travel widely, and so does the fact that you are working on the code."], ["Hold the work until the whole code is solved, so nothing is half-known.", "No half-truths spread, but the work is slow and unseen. When it is needed, nobody trusts a team that has shown nothing."]] },
        { src: "Navy Department, February 1941", text: "In a few weeks you will be sent to Britain to swap cipher knowledge. The British know how to read German machine ciphers. You know about Japanese ones. Giving too little will end the exchange. Giving too much could put American secrets in British files.", ask: "What do you carry in your briefcase?",

    el.innerHTML = `<div class="paper"><p class="src">Orders · your piece: ${esc(pl)}</p><h2>${esc(rr.ask)}</h2><ul class="menu">${ord.map((ci, j) => `<li><button class="mitem" data-j="${j}" aria-pressed="false"><span class="key">${"ABC"[j]}</span><span>${esc(rr.c[ci][0])}</span></button></li>`).join("")}</ul>
      <div class="sendrow"><button class="btn" id="send" disabled>Send orders</button><p class="small" id="shint">Select an option first. You cannot undo orders once sent.</p></div></div>`;
    const sel = (j) => { chosen = j; $$(".mitem", el).forEach((b) => b.setAttribute("aria-pressed", String(+b.dataset.j === j))); $("#send").disabled = false; $("#shint").textContent = "Option " + "ABC"[j] + " selected. Press Send orders (or Enter) to commit."; };
    const send = () => { if (chosen === null || stage !== "work") return; L.choose(S, chosen); const b = board(); b.own = { role: role.id, rounds: S.i + 1 }; b.prog = b.prog || {}; b.prog[role.id] = Math.max(b.prog[role.id] || 0, S.i + 1); store.set("cb_board", b); stage = "outcome"; render(); window.scrollTo(0, 0); };
    $$(".mitem", el).forEach((b) => b.addEventListener("click", () => sel(+b.dataset.j)));
    $("#send").addEventListener("click", send);
    window.__sel = sel; window.__send = send;
  }
  document.addEventListener("keydown", (ev) => {
    if (ev.ctrlKey || ev.metaKey || ev.altKey || view !== "round" || stage !== "work" || !solved) return;
    const tag = ev.target && ev.target.tagName; if (/TEXTAREA|INPUT|SELECT/.test(tag)) return;
    const j = "abc".indexOf(ev.key.toLowerCase());
    if (j >= 0 && ev.key.length === 1 && window.__sel) { ev.preventDefault(); window.__sel(j); }
    else if (ev.key === "Enter" && tag !== "BUTTON" && chosen !== null && window.__send) { ev.preventDefault(); window.__send(); }
  });

  /* ---------- end ---------- */
  function renderEnd() {
    const fs = L.finalScore(S), e = fs.e, rank = L.rank(fs.total), id = L.signalId(S), role = S.role, rIdx = D.RANKS.indexOf(rank);
    S.ended = { fs, e, rank, id };
    const b = board(); b.own = { role: role.id, rounds: 6 }; b.prog = b.prog || {}; b.prog[role.id] = 6; store.set("cb_board", b); saveGame(true);
    const meters = METERS.map(([k, n]) => `<div class="meter"><span class="ml">${n}</span><span class="mt"><span class="mf m-${k}" style="width:${S.st[k]}%"></span></span><b>${S.st[k]}</b></div>`).join("");
    root.innerHTML = topbar() + `<main class="wrap">
      <section class="endhero"><div class="pw">${ART.portrait(role.id, "end")}<div class="stampbig">CLEARED<br>${esc(rank.title.toUpperCase())}</div></div><div><p class="kick">FILE CLOSED · ${esc(role.name.toUpperCase())}</p><h1 data-focus tabindex="-1">${esc(e.title)}</h1><p class="small">${esc(e.tag)}</p><p>${esc(e.desc)}</p></div></section>
      <section class="stats"><div class="stat"><span class="sl">FINAL SCORE</span><b>${fs.total}</b><small>Choices ${S.score} · Stats ${fs.meters} · Ending ${fs.ending}</small></div><div class="stat"><span class="sl">RANK</span><b class="t">${esc(rank.title)}</b><small>${rIdx + 1} of ${D.RANKS.length}</small></div><div class="stat wide"><span class="sl">SIGNAL ID</span><b class="mono" id="sigid">${id}</b><small>Goes on your Padlet card. Classmates decode it.</small></div></section>
      <div class="meters3">${meters}</div>
      <p class="note"><b>Think about it.</b> ${esc(e.ask)}</p><p class="note"><b>Real people in roles like yours.</b> ${esc(role.echo)}</p>
      <section><h2>Your decisions</h2><ol class="journey">${S.log.map((x) => `<li><span class="jd">${esc(D.ROUNDS[x.i].date)}</span><b>${esc(D.ROUNDS[x.i].title)}</b><span>${"ABC"[x.slot]}. ${esc(x.label)}</span><span class="jk">${esc(KIND_NOTE[x.kind])}</span></li>`).join("")}</ol></section>
      <section class="decoder"><h2>Decode a classmate</h2><p>Find a classmate's Padlet card from a different role. Type their Signal ID here. You will see their choices and unlock their pieces of the messages.</p>${decoderForm()}</section>
      <section class="padlet"><h2>Post to Padlet</h2><p>Add your card image and post text to the class Padlet. Then decode classmates from other roles with the Signal IDs on their cards, and reply to their posts.</p>
        <div class="cardwrap" id="cardsvg">${cardSVG()}</div><div class="row"><button class="btn" id="dl">Download card image</button><button class="btn ghost" id="cpimg">Copy image</button></div>
        <div class="field"><label for="qsel">Question for your classmates</label><select id="qsel">${role.qs.concat([e.ask]).map((q, i) => `<option value="${i}">${esc(clip(q, 100))}</option>`).join("")}</select></div>
        <div class="field"><label for="ptext">Post text (edit it so it sounds like you)</label><textarea id="ptext" rows="12"></textarea></div><div class="row"><button class="btn" id="cptext">Copy post text</button><button class="btn ghost" id="again">Play another role</button></div><p class="small cmsg" role="status"></p></section></main>`;
    const qs = role.qs.concat([e.ask]), paint = () => { $("#ptext").value = cardText(qs[+$("#qsel").value]); };
    $("#qsel").addEventListener("change", paint); paint();
    $("#cptext").addEventListener("click", (ev) => copyText($("#ptext").value, ev.currentTarget, "Copied. Paste it into your Padlet post."));
    $("#again").addEventListener("click", () => { store.set("cb_game", null); S = null; picked = null; go("pick"); });
    $("#dl").addEventListener("click", downloadCard); $("#cpimg").addEventListener("click", copyCard);

  }
  function cardText(q) {
    const fs = S.ended.fs, role = S.role;
    const L1 = "━━━━━━━━━━━━━━━━━━━━";
    return [`${S.name.toUpperCase()} · ${role.name} · ${S.ended.e.title}`, `${S.ended.rank.title} · Score ${fs.total}`, "", L1, `SIGNAL ID: ${S.ended.id}`, L1, "", `Secrecy ${S.st.s} · Impact ${S.st.i} · Trust ${S.st.t}`, "", L1, "MY DECISIONS", L1, ...S.log.map((x) => `${x.i + 1}. ${D.ROUNDS[x.i].title}: ${x.label}`), "", L1, "MY PIECES", L1, ...D.ROUNDS.map((r, i) => `${i + 1}. "${L.piece(i, role.id)}"`), "", L1, "QUESTION FOR YOU", L1, q, "", L1, "To reply: decode my Signal ID in Codebreakers: The Silent Service, then quote it in your reply.", "#NeedToKnow"].join("\n");
  }
  function cardSVG() {
    const role = S.role, fs = S.ended.fs, W = 640, H = 500;
    const rows = S.log.map((x, i) => `<text x="206" y="${272 + i * 31}" font-size="12" fill="#dfe3dc"><tspan fill="#f0b93a" font-weight="700">${i + 1}  ${esc(L.piece(i, role.id))}</tspan></text><text x="206" y="${286 + i * 31}" font-size="11" fill="#8e9a93">${esc(clip(x.label, 54))}</text>`).join("");
    const bar = (k, n, y) => `<text x="206" y="${y}" font-size="11" fill="#8e9a93" letter-spacing="2">${n.toUpperCase()}</text><rect x="290" y="${y - 9}" width="220" height="9" fill="#1a2320"/><rect x="290" y="${y - 9}" width="${S.st[k] * 2.2}" height="9" fill="${{ s: "#4f7d96", i: "#f0b93a", t: "#5f9e6e" }[k]}"/><text x="520" y="${y}" font-size="11" fill="#dfe3dc">${S.st[k]}</text>`;
    return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" font-family="Courier New, monospace" shape-rendering="crispEdges"><rect width="${W}" height="${H}" fill="#07090a"/><rect x="10" y="10" width="${W - 20}" height="${H - 20}" fill="none" stroke="#46555b" stroke-width="4"/>
      <path d="M10 34v-24h24M${W - 34} ${H - 10}h24v-24" stroke="#f0b93a" stroke-width="4" fill="none"/>
      <text x="28" y="40" font-size="11" fill="#e0544a" letter-spacing="4">TOP SECRET // CODEBREAKERS: THE SILENT SERVICE</text>
      <g transform="translate(28 56)"><rect width="152" height="176" fill="#000" stroke="#46555b" stroke-width="4"/><svg x="0" y="0" width="152" height="176" viewBox="0 0 120 140" preserveAspectRatio="xMidYMid slice">${ART.portraitInner(role.id, "cd")}</svg></g>
      <text x="206" y="82" font-size="30" font-weight="700" fill="#dfe3dc" letter-spacing="1">${esc(clip(S.name.toUpperCase(), 16))}</text><text x="206" y="106" font-size="14" fill="#f0b93a">${esc(role.name)}</text><text x="206" y="126" font-size="13" fill="#8e9a93">${esc(S.ended.e.title)}</text>
      <g><rect x="396" y="40" width="200" height="60" fill="none" stroke="#e0544a" stroke-width="4"/><text x="496" y="64" text-anchor="middle" font-size="12" fill="#e0544a" font-weight="700" letter-spacing="3">CLEARED</text><text x="496" y="88" text-anchor="middle" font-size="14" fill="#e0544a" font-weight="700">${esc(clip(S.ended.rank.title.toUpperCase(), 18))}</text></g>
      ${bar("s", "Secrecy", 156)}${bar("i", "Impact", 176)}${bar("t", "Trust", 196)}
      <text x="206" y="222" font-size="11" fill="#8e9a93" letter-spacing="2">SCORE</text><text x="262" y="222" font-size="15" font-weight="700" fill="#dfe3dc">${fs.total}</text><text x="320" y="222" font-size="11" fill="#8e9a93" letter-spacing="2">SIGNAL ID</text><text x="398" y="222" font-size="17" font-weight="700" fill="#f0b93a" letter-spacing="2">${S.ended.id}</text>
      <text x="28" y="262" font-size="11" fill="#8e9a93" letter-spacing="3">PIECES</text>${S.log.map((x, i) => `<text x="28" y="${284 + i * 31}" font-size="12" fill="#f0b93a" font-weight="700">R${i + 1} ${esc(clip(L.piece(i, role.id), 12))}</text>`).join("")}
      ${S.log.map((x, i) => `<text x="206" y="${284 + i * 31}" font-size="11" fill="#c9d0c8">${esc(clip(x.label, 56))}</text>`).join("")}
      <text x="28" y="${H - 26}" font-size="10" fill="#6e8077">Decode this Signal ID in Codebreakers: The Silent Service to read my choices. · Unit 10 World History</text></svg>`;
  }
  async function cardPNG() {
    const svg = $("#cardsvg svg"), vb = svg.viewBox.baseVal, scale = 2, xml = new XMLSerializer().serializeToString(svg);
    const img = new Image(); await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(xml); });
    const c = document.createElement("canvas"); c.width = vb.width * scale; c.height = vb.height * scale; const cx = c.getContext("2d"); cx.imageSmoothingEnabled = false; cx.drawImage(img, 0, 0, c.width, c.height);
    return new Promise((res) => c.toBlob(res, "image/png"));
  }
  async function downloadCard() {
    const msg = (t) => { const m = $("#cardsvg").closest("section").querySelector(".cmsg"); if (m) m.textContent = t; };
    try {
      const blob = await cardPNG(), name = "need-to-know-" + S.name.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") + ".png";
      let dl = null; try { dl = window.claude && window.claude.use ? await window.claude.use("downloads") : null; } catch (e) { }
      if (dl) { try { await dl.save({ filename: name, data: blob }); msg("Card image saved. Attach it to your Padlet post."); return; } catch (e) { if (e && e.code === "declined") return; } }
      const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); msg("Card image downloaded. Attach it to your Padlet post.");
    } catch (e) { msg("Could not make the image. Take a screenshot of the card instead."); }
  }
  async function copyCard() {
    const m = $("#cardsvg").closest("section").querySelector(".cmsg");
    try { const blob = await cardPNG(); await navigator.clipboard.write([new ClipboardItem({ "image/png": blob })]); m.textContent = "Card image copied. Paste it into Padlet."; } catch (e) { m.textContent = "Your browser would not copy the image. Use Download instead."; }
  }

  /* ---------- decoder ---------- */
  function decoderForm() { return `<div class="dform"><label for="sid" class="sr">Signal ID</label><input id="sid" placeholder="Example: BP-ACBACB-FD" autocomplete="off" spellcheck="false" maxlength="16"><button class="btn" id="dgo">Decode</button></div><p class="err" id="derr" role="alert"></p><div id="dres" aria-live="polite"></div>`; }
  function bindDecoder() {
    const run = () => {
      const p = L.parseSignal($("#sid").value), err = $("#derr"); $("#dres").innerHTML = "";
      if (!p) { err.textContent = "That Signal ID does not decode. Check the letters and dashes. It looks like XX-ABCABC-YY."; return; }
      err.textContent = ""; const b = board(); if (b.sig.indexOf(p.id) < 0) { b.sig.push(p.id); store.set("cb_board", b); }
      lastDecoded = p.id; $("#dres").innerHTML = decodedCard(p); bindReply(p);
    };
    $("#dgo").addEventListener("click", run); $("#sid").addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });
    if (lastDecoded && view === "board") { const p = L.parseSignal(lastDecoded); if (p) { $("#sid").value = ""; } }
  }
  function decodedCard(p) {
    const mine = S && S.role ? S : null;
    const rows = p.picks.map((x, i) => `<li><span class="jd">R${i + 1} · ${esc(D.ROUNDS[i].title)}</span><span class="pc">“${esc(L.piece(i, p.role.id))}”</span><span>${esc(x.label)}</span></li>`).join("");
    const sameRole = mine && mine.role.id === p.role.id;
    return `<div class="paper decoded"><p class="src">DECODED · ${esc(p.id)}</p><div class="dp"><div>${ART.portrait(p.role.id, "dc" + p.role.id)}</div><div><h3>${esc(p.role.name)}</h3><p><b>${esc(p.ending.title)}</b> · ${esc(p.rank.title)} · score ${p.fs.total}</p><p class="small">Their pieces are now on the board.</p></div></div>${sameRole ? `<p class="warn">This is the same role as yours, so it adds no new pieces. Look for a different role to fill the board.</p>` : ""}<ol class="journey">${rows}</ol>
      <div class="field"><label for="rr">Reply about round</label><select id="rr">${D.ROUNDS.map((r, i) => `<option value="${i}">${i + 1}. ${esc(r.title)}</option>`).join("")}</select></div>
      <div class="field"><label for="rq">Question for them (pick one)</label><select id="rq"></select></div>
      <textarea id="rtext" rows="6" readonly aria-label="Reply text"></textarea><div class="row"><button class="mini" id="cprep">Copy reply</button></div><p class="small cmsg" role="status"></p><p class="small">Paste this as a reply on their card post on Padlet.</p></div>`;
  }

  const REPLY_QS = ["What did you think would happen when you made that choice?", "Which of Secrecy, Impact or Trust were you protecting?", "Would you make the same choice again? Why or why not?", "What did your role know that other roles did not?"];
  function bindReply(p) {
    const rrs = $("#rr"), rq = $("#rq"), ta = $("#rtext"); if (!rrs) return;
    const fill = () => { const r = +rrs.value, prev = rq.value; rq.innerHTML = [D.ROUNDS[r].ask].concat(REPLY_QS).map((q, i) => `<option value="${i}">${esc(clip(q, 90))}</option>`).join(""); if (prev) rq.value = prev; paint(); };
    const paint = () => {
      const r = +rrs.value, qs = [D.ROUNDS[r].ask].concat(REPLY_QS), mineRole = (S && S.role) || (board().own && L.roleById(board().own.role));
      let mine = mineRole ? `I played ${mineRole.name}.` : "";
      if (S && S.log[r]) mine = `I chose: ${S.log[r].label}\n` + (S.log[r].label === p.picks[r].label ? "We made the same call." : "We made different calls.");
      const L1 = "━━━━━━━━━━━━━━━━━━━━";
      ta.value = [`DECODED ${p.id} (${p.role.name})`, L1, `ROUND ${r + 1}: ${D.ROUNDS[r].title}`, L1, `You chose: ${p.picks[r].label}`, ...(mine ? ["", mine] : []), "", L1, "QUESTION FOR YOU", L1, qs[+rq.value || 0]].join("\n");
    };
    rrs.addEventListener("change", fill); rq.addEventListener("change", paint); fill();
    $("#cprep").addEventListener("click", (e) => copyText(ta.value, e.currentTarget, "Copied. Paste it as a reply on their Padlet post."));
  }

  /* ---------- completion post ---------- */
  function completionText(b, parsed, refl) {
    const prog = b.prog || {}, mine = (b.own && L.roleById(b.own.role)) || null, nm = store.get("cb_name", "") || "Anonymous";
    const ids = parsed.map((p) => p.id + " (" + p.role.short + ")").join(", ");
    return `MISSION COMPLETE · ${nm.toUpperCase()}${mine ? " · " + mine.name : ""}\nI decoded all six secret messages with help from classmates.\n\n` + D.ROUNDS.map((r, i) => `${i + 1}. ${r.title} (${r.date}): ${r.msg.join(" ")}`).join("\n") + `\n\nDecoded with Signal IDs from: ${ids || "none yet"}\n` + (refl ? "\n" + refl + "\n" : "");
  }
  function completion(b, parsed, full) {
    if (full < 6) return `<section class="panel"><h2>Submission</h2><p>Decode all six messages to unlock your submission for the teacher. You need Signal IDs from all four other roles. ${6 - full} to go.</p></section>`;
    return `<section class="padlet panel"><h2>All six messages decoded</h2><p><b>Do not post this on Padlet.</b> Other students could copy it. Copy it and submit it to your teacher the way your class turns in assignments. Add a sentence about what you learned.</p>
      <div class="field"><label for="crefl">Your reflection (one or two sentences)</label><textarea id="crefl" rows="3" placeholder="Which message surprised you most, and why?"></textarea></div>
      <div class="field"><label for="cptext2">Your submission</label><textarea id="cptext2" rows="14" readonly></textarea></div>
      <div class="row"><button class="btn" id="cppost">Copy submission</button></div><p class="small cmsg" role="status"></p></section>`;
  }

  /* ---------- board ---------- */
  function renderBoard() {
    const b = board(), parsed = b.sig.map(L.parseSignal).filter(Boolean), have = {};
    parsed.forEach((p) => { have[p.role.id] = true; });
    const own = b.own || null;
    const prog = b.prog || {}; if (own && prog[own.role] === undefined) prog[own.role] = own.rounds;
    const known = (r, rid) => (prog[rid] || 0) > r || !!have[rid];
    let full = 0;
    const rows = D.ROUNDS.map((rd, r) => {
      const n = D.ROLES.filter((x) => known(r, x.id)).length, done = n === 5; if (done) full++;
      const slots = D.ROLES.map((x) => `<li class="slot ${known(r, x.id) ? "got" : ""}"><span>${esc(x.short)}</span><b>${known(r, x.id) ? esc(L.piece(r, x.id)) : "?????"}</b></li>`).join("");
      return `<section class="brow ${done ? "full" : ""}"><h3>Round ${r + 1}: ${esc(rd.title)} <span class="cnt">${done ? "● MESSAGE COMPLETE" : n + " OF 5 PIECES"}</span></h3><ol class="slots">${slots}</ol>${done ? `<div class="paper"><p class="src">Full message</p><p class="fullmsg">${esc(rd.msg.join(" "))}</p><p>${esc(rd.real)}</p><p class="eq"><b>Discuss</b> ${esc(rd.ask)}</p></div>` : ""}</section>`;
    }).join("");
    root.innerHTML = topbar() + `<main class="wrap"><button class="mini" id="bk">Back</button><h1 data-focus tabindex="-1">Decoder board</h1>
      <p class="lede">Each round hides a five-part message. You hold one part of each. Decode classmates' Signal IDs from other roles to fill the rest. ${full} of 6 messages complete.</p>
      <section class="decoder"><h2>Decode a Signal ID</h2>${decoderForm()}</section>
      ${parsed.length ? `<section><h2>Decoded so far</h2><ul class="chiplist">${parsed.map((p) => `<li><button class="chipb" data-sig="${p.id}">${esc(p.id)} · ${esc(p.role.short)}</button></li>`).join("")}</ul></section>` : ""}
      ${completion(b, parsed, full)}
      ${rows}<p class="small"><button class="mini" id="clr">Clear decoded signals</button></p></main>`;
    $("#bk").addEventListener("click", () => go(prevView === "board" ? "title" : prevView));
    bindDecoder();
    $$("[data-sig]").forEach((c) => c.addEventListener("click", () => { const p = L.parseSignal(c.dataset.sig); $("#dres").innerHTML = decodedCard(p); bindReply(p); $("#dres").scrollIntoView({ block: "nearest" }); }));
    const cp = $("#cppost"); if (cp) { const ta = $("#cptext2"), refl = $("#crefl"), upd = () => { ta.value = completionText(b, parsed, refl.value.trim()); }; refl.addEventListener("input", upd); upd(); cp.addEventListener("click", (e) => copyText(ta.value, e.currentTarget, "Copied. Submit it to your teacher. Do not post it on Padlet.")); }
    $("#clr").addEventListener("click", () => { const b2 = board(); b2.sig = []; store.set("cb_board", b2); renderBoard(); bindGo(); });
  }



  const h = location.hash; view = h === "#board" ? "board" : "title"; render();
})();
